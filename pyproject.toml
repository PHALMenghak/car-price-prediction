[project]
name = "car-price-prediction"
version = "0.1.0"
description = "Cambodia car price prediction pipeline — scrapes Khmer24, engineers features, and trains an ML model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi==0.7.3",
    "pydantic==2.7.4",
    "pandas==2.2.2",
    "pyarrow==16.1.0",
    "python-dotenv==1.0.1",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "dbt-core>=1.11.14",
    "dbt-duckdb>=1.11.0",
]

[project.scripts]
scrape    = "main:main"
transform = "pipeline.dbt_runner:main"
pipeline  = "main:run_full_pipeline"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
