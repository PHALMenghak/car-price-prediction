name: Daily Car Scraper Pipeline

on:
  schedule:
    # Runs daily at 02:00 UTC (09:00 AM Cambodia Time)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Max pages to scrape'
        required: false
        default: '20'
        type: string
      target_category:
        description: 'Category slug'
        required: false
        default: 'cars-for-sale'
        type: string

jobs:
  scrape:
    name: Scrape Khmer24 Cars
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # required to git-push scraped data back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for incremental ID tracking

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Scraper
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '20' }}
          TARGET_CATEGORY: ${{ github.event.inputs.target_category || 'cars-for-sale' }}
          PYTHONUTF8: "1"
          KHMER24_DEVICE_ID: ${{ secrets.KHMER24_DEVICE_ID }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          KHMER24_PROXY: ${{ secrets.KHMER24_PROXY }}
        run: uv run python main.py

      - name: Commit & push scraped data back to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/processed/ logs/
          git diff --cached --quiet || git commit -m "chore: daily scrape $(date -u +%Y-%m-%d)"
          git push
        continue-on-error: true   # do not fail the pipeline if there is nothing new to commit

      - name: Upload Raw & Processed Parquet Data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: car-data-${{ github.run_id }}
          path: |
            data/raw/cars_*.parquet
            data/raw/*.csv
            data/processed/*.parquet
            data/processed/*.csv
            logs/scraper.log
          retention-days: 30
