name: Daily Car Scraper Pipeline

on:
  schedule:
    # Runs daily at 02:00 UTC (09:00 AM Cambodia Time)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Max pages to scrape'
        required: false
        default: '50'
        type: string
      target_category:
        description: 'Category slug'
        required: false
        default: 'cars-for-sale'
        type: string
      scrape_mode:
        description: 'Scrape mode'
        required: false
        default: 'feed_window'
        type: choice
        options:
          - feed_window
          - delta_only
      enrich_details:
        description: 'Enrich post details (deeper attributes)'
        required: false
        default: false
        type: boolean

jobs:
  scrape:
    name: Scrape Khmer24 Cars
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # required to git-push scraped data back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for incremental ID tracking

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Pre-flight connectivity check
        env:
          POSTS_API_BASE: ${{ secrets.POSTS_API_BASE }}
          RELAY_KEY:      ${{ secrets.RELAY_KEY }}
        run: |
          if [ -n "${POSTS_API_BASE}" ] && [ -n "${RELAY_KEY}" ]; then
            echo "Cloudflare Worker relay is configured."
            echo "Testing Worker at: ${POSTS_API_BASE}"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 \
              -H "X-Relay-Key: ${RELAY_KEY}" \
              "${POSTS_API_BASE}?target=https://api-posts.khmer24.com/feed&category=cars-for-sale&limit=1&lang=en" \
              || echo "000")
            echo "Worker HTTP status: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Worker relay is reachable and working."
            else
              echo "::warning::Worker returned HTTP $HTTP_CODE — check your Worker deployment and RELAY_KEY secret."
            fi
          else
            echo "No Worker relay configured — testing direct API access."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 \
              "https://api-posts.khmer24.com/feed?category=cars-for-sale&limit=1&lang=en" \
              || echo "000")
            echo "Direct API HTTP status: $HTTP_CODE"
            if [ "$HTTP_CODE" = "403" ]; then
              echo "::warning::HTTP 403 — Cloudflare is blocking this runner's IP."
              echo "::warning::Set POSTS_API_BASE and RELAY_KEY secrets to enable the Worker relay."
            elif [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Direct access is working."
            fi
          fi

      - name: Run Scraper
        env:
          MAX_PAGES:         ${{ github.event.inputs.max_pages || '50' }}
          TARGET_CATEGORY:   ${{ github.event.inputs.target_category || 'cars-for-sale' }}
          SCRAPE_MODE:       ${{ github.event.inputs.scrape_mode || 'feed_window' }}
          ENRICH_DETAILS:    ${{ github.event.inputs.enrich_details || 'false' }}
          PYTHONUTF8:        "1"
          KHMER24_DEVICE_ID: ${{ secrets.KHMER24_DEVICE_ID }}
          HTTPS_PROXY:       ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY:        ${{ secrets.HTTP_PROXY }}
          KHMER24_PROXY:     ${{ secrets.KHMER24_PROXY }}
          # Cloudflare Worker relay — set these to bypass Cloudflare IP blocking
          POSTS_API_BASE:    ${{ secrets.POSTS_API_BASE }}
          RELAY_KEY:         ${{ secrets.RELAY_KEY }}
        run: uv run python main.py

      - name: Run dbt Transformations & Data Tests
        env:
          PYTHONUTF8: "1"
        run: |
          uv run dbt run --project-dir dbt --profiles-dir dbt
          uv run dbt test --project-dir dbt --profiles-dir dbt

      - name: Commit & push scraped & processed data back to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/processed/ logs/
          git diff --cached --quiet || git commit -m "chore: daily scrape $(date -u +%Y-%m-%d)"
          git push
        continue-on-error: true   # do not fail the pipeline if there is nothing new to commit

      - name: Upload Raw & Processed Parquet Data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: car-data-${{ github.run_id }}
          path: |
            data/raw/cars_*.parquet
            data/raw/*.csv
            data/raw/*.json
            data/processed/*.parquet
            data/processed/*.csv
            logs/scraper*.log
          retention-days: 30
