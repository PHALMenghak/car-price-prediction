# dbt/profiles.yml
# DuckDB connection profile for local zero-cost execution.
#
# ── HOW TO RUN ─────────────────────────────────────────────────────────────────
# Always run dbt commands from the PROJECT ROOT (not from inside dbt/):
#
#   dbt run   --project-dir dbt  --profiles-dir dbt
#   dbt test  --project-dir dbt  --profiles-dir dbt
#   dbt docs generate --project-dir dbt  --profiles-dir dbt
#
# Or use the shortcut scripts (if configured in pyproject.toml):
#   uv run dbt-run
#
# ── PATH RESOLUTION ────────────────────────────────────────────────────────────
# external_root: '.'  → DuckDB resolves read_parquet('data/raw/…') relative to
#                        the PROJECT ROOT (where you run the dbt command from).
#                        This means 'data/raw/cars_*.parquet' correctly finds
#                        the files at <project_root>/data/raw/cars_*.parquet
#
# path: 'data/processed/khmer24.duckdb' → The Gold table (fct_cars_ml_features)
#                        is persisted to disk. ML training notebooks can then
#                        connect and read it directly without re-running dbt.
# ───────────────────────────────────────────────────────────────────────────────

khmer24_duckdb:
  target: dev
  outputs:

    # ── Local development ──────────────────────────────────────────────────────
    dev:
      type: duckdb
      path: 'data/processed/khmer24.duckdb'   # persisted to disk (project root relative)
      threads: 4
      extensions:
        - parquet
        - httpfs
      external_root: '.'    # resolves all read_parquet() paths from project root

    # ── Production profile (optional): Google BigQuery cloud warehouse ─────────
    prod_bigquery:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', 'car-price-cambodia') }}"
      dataset: khmer24_cars
      threads: 8
      timeout_seconds: 300
      location: US
