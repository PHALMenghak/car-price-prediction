version: 2

models:
  - name: stg_khmer24_cars
    description: "Bronze: Historical daily snapshots of Khmer24 listings (grain: listing_id + scrape_date)."
    columns:
      - name: listing_id
        tests:
          - not_null
      - name: scrape_date
        tests:
          - not_null

  - name: int_cars_cleaned
    description: "Silver: Normalized, standardized vehicle specs with 5-tier data quality flags & diagnostic audit reasons."
    columns:
      - name: listing_id
        tests:
          - not_null
      - name: scrape_date
        tests:
          - not_null
      - name: data_quality_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['VALID', 'WARNING', 'SUSPICIOUS', 'INVALID', 'QUARANTINED']

  - name: fct_car_listings
    description: "Gold BI: Curated fact table for dashboard analytics and inventory reporting (grain: listing_id)."
    columns:
      - name: listing_id
        tests:
          - unique
          - not_null
      - name: price
        tests:
          - not_null

  - name: fct_cars_ml_features
    description: "Gold ML: Leakage-free Day-0 appraisal feature store with log_price target for ML models (grain: listing_id)."
    columns:
      - name: listing_id
        tests:
          - unique
          - not_null
      - name: log_price
        tests:
          - not_null
      - name: price
        tests:
          - not_null

  - name: int_cars_audit_lineage
    description: "Virtual QA audit view providing side-by-side inspection between Silver and Bronze (Pattern B)."
    columns:
      - name: listing_id
        tests:
          - not_null
      - name: scrape_date
        tests:
          - not_null
